name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Windows runner：桌面版（Wails）只能在 Windows 編；server 純 Go，順便交叉編 Linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: tag、VERSION、version.go 與 commit 必須一致
        run: bash scripts/release/check-version.sh

      - name: 測試
        run: go test ./internal/...

      - name: 測試（production 標籤，前端嵌入）
        run: go test -tags production ./internal/...

      - name: 打包（產物與 checksums 到 dist/）
        run: bash scripts/release/package.sh dist

      - name: 發佈 Release（草稿優先：比對通過才公開為 latest）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release/publish.sh dist
