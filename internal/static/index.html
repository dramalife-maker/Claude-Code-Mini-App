<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <!-- 選用：反代下 API 與自動推算不一致時設 content="/部署前綴"（無則由目前 index.html 目錄自動推算） -->
  <!-- <meta name="cc-api-base" content="" /> -->
  <title>Claude Code · Remote Agent</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });</script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <style>
    :root {
      --tg-content-safe-top: 0px;
      --ra-bg0: oklch(0.15 0.02 264);
      --ra-bg1: oklch(0.13 0.02 264);
      --ra-surface: oklch(0.19 0.02 264);
      --ra-border: oklch(0.28 0.02 264);
      --ra-accent: oklch(0.62 0.19 275);
      --ra-accent-soft: oklch(0.62 0.19 275 / 18%);
      --ra-text: oklch(0.94 0.01 264);
      --ra-muted: oklch(0.55 0.01 264);
    }
    body.ra-body {
      background: var(--ra-bg0);
      color: var(--ra-text);
      font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    }
    .ra-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .ra-display { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
    .h-app { height: var(--tg-viewport-height, 100svh); }
    @media (max-width: 767px) {
      input, textarea, select { font-size: 16px !important; }
    }
    .prose pre { margin: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }
    .prose pre code { white-space: pre; font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .prose code:not(pre code) {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: oklch(0.24 0.02 264); padding: 0.1em 0.45em; border-radius: 4px; font-size: 0.9em;
      color: oklch(0.9 0.01 264);
    }
    .prose p { margin: 0.5em 0; line-height: 1.8; }
    .prose ul, .prose ol { padding-left: 1.5em; margin: 0.5em 0; }
    .prose h1,.prose h2,.prose h3 { font-weight: 700; margin: 0.75em 0 0.25em; color: oklch(0.94 0.01 264); }
    .prose table { border-collapse: collapse; min-width: 100%; }
    .prose table th, .prose table td { border: 1px solid oklch(0.28 0.02 264); padding: 0.3em 0.75em; white-space: nowrap; }
    .prose table th { background: oklch(0.22 0.02 264); font-weight: 600; }
    .prose .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0.5em 0; }
    /* 1a：使用者實心紫泡泡；Claude 無邊框文件流 */
    .bubble-claude {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: hidden; min-width: 0;
      padding: 0 !important;
    }
    .bubble-user {
      background: oklch(0.62 0.19 275);
      border: none;
      color: white;
      border-radius: 14px 14px 4px 14px;
      overflow: hidden; min-width: 0;
      box-shadow: 0 8px 24px oklch(0.62 0.19 275 / 18%);
    }
    .bubble-shell {
      background: oklch(0.12 0.01 264);
      border: 1px solid oklch(0.3 0.02 264);
      border-radius: 12px;
      overflow: hidden; min-width: 0;
    }
    .ra-cmd-bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: oklch(0.19 0.02 264);
      border: 1px solid oklch(0.3 0.02 264);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 0;
    }
    .ra-cmd-bar.shell {
      background: #120d00;
      border-color: rgba(180, 83, 9, 0.45);
    }
    .ra-cmd-badge {
      font-size: 12px;
      font-weight: 600;
      color: oklch(0.65 0.19 275);
      background: oklch(0.62 0.19 275 / 16%);
      border-radius: 7px;
      padding: 5px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ra-cmd-badge.shell {
      color: #fcd34d;
      background: rgba(180, 83, 9, 0.28);
    }
    .ra-session-card {
      margin: 1px 0;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .ra-session-card:hover {
      background: oklch(0.62 0.19 275 / 8%);
      border-color: oklch(0.62 0.19 275 / 22%);
    }
    .ra-session-card.active {
      background: oklch(0.24 0.03 270);
      border-color: oklch(0.34 0.04 272);
    }
    .ra-status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .ra-status-dot.idle { background: oklch(0.7 0.15 155); }
    .ra-status-dot.running { background: oklch(0.75 0.15 70); }
    .ra-status-dot.awaiting { background: oklch(0.75 0.15 70); }
    .ra-status-dot.done { background: oklch(0.55 0.01 264); }

    @keyframes streaming-dots {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .streaming-tail {
      display: inline-block;
      margin-left: 0.1em;
      letter-spacing: 0.02em;
      color: oklch(0.75 0.14 275);
      animation: streaming-dots 1s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; }
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: oklch(0.62 0.19 275); margin: 0 2px; animation: pulse-dot 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .app-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: oklch(0.4 0.02 264) transparent;
      overscroll-behavior-y: contain;
    }
    .app-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .app-scroll::-webkit-scrollbar-track { background: transparent; }
    .app-scroll::-webkit-scrollbar-thumb {
      background: oklch(0.4 0.02 264);
      border-radius: 8px;
    }
    .app-scroll::-webkit-scrollbar-thumb:hover {
      background: oklch(0.5 0.08 275);
    }
    @keyframes ra-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ra-card-enter { animation: ra-fade-in 0.35s ease-out both; }
  </style>
</head>
<body class="h-app ra-body">

<script type="text/babel" data-presets="react-classic" src="./js/core/core.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/ui/ui-atoms.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/hooks/useChatSocket.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/hooks/useNewSessionForm.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/chat/ForwardModal.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/session/SessionView.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/chat/chat-header.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/chat/ChatView.js"></script>
<script type="text/babel" data-presets="react-classic" src="./js/app.js"></script>

<div id="root" class="h-app"></div>
</body>
</html>
